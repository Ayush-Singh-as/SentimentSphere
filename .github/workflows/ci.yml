name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "1337"

jobs:
  quality:
    name: lint + types + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --python pins the interpreter explicitly: `uv python install` only makes
      # a version available, it does not select it for the sync.
      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra baseline --extra serving --extra demo

      - name: Confirm the matrix interpreter is the one in use
        run: |
          ACTUAL=$(uv run python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          if [ "$ACTUAL" != "${{ matrix.python-version }}" ]; then
            echo "::error::expected Python ${{ matrix.python-version }}, got $ACTUAL"
            exit 1
          fi
          echo "running on Python $ACTUAL"

      - name: Lint
        run: |
          uv run ruff check src tests apps scripts
          uv run ruff format --check src tests apps scripts

      - name: Type-check (strict on src/)
        # mypy targets 3.12 (see [tool.mypy] in pyproject.toml for why), so
        # running it once is sufficient; tests still cover both versions.
        if: matrix.python-version == '3.12'
        run: uv run mypy src

      # --cov-fail-under is the Phase 8 gate. The serving/demo extras are
      # installed above so those suites actually run rather than skipping.
      - name: Tests
        run: |
          uv run pytest \
            -m "not needs_data and not needs_artifacts and not gpu" \
            --cov --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=80

      - name: Smoke-test the CLI
        run: |
          uv run sphere version
          uv run sphere labels
          uv run sphere labels --source tess
          uv run sphere info --json

      # End-to-end on the real tracked corpus: freeze the split, train and
      # calibrate the head, then predict through the registered artifact. This
      # is what would have caught v1's dead model path.
      - name: Reproduce the text baseline end to end
        run: |
          uv run sphere data --dataset text_aggregate
          uv run sphere train --config configs/text/tfidf_lr.yaml
          uv run sphere predict --text "I am thrilled with how this turned out" --json
          uv run python scripts/measure_latency.py --runs 50

      - name: Confirm the frozen manifest was not modified
        run: git diff --exit-code -- manifests/

      - name: Build the docs
        if: matrix.python-version == '3.12'
        run: uv run mkdocs build --strict

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: build the Space image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t sentimentsphere:ci -f apps/space/Dockerfile .
      - name: Smoke-run the demo
        run: |
          docker run -d --name demo -p 7860:7860 sentimentsphere:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7860/ >/dev/null 2>&1; then
              echo "demo answered after ${i}s"
              docker rm -f demo
              exit 0
            fi
            sleep 1
          done
          echo "::error::the demo container never served a response"
          docker logs demo
          docker rm -f demo
          exit 1

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v1 accumulated 274 MB of committed audio and a 16 MB model file. These
      # two checks are why that cannot happen again.
      - name: Reject large blobs
        run: |
          LIMIT=$((2 * 1024 * 1024))
          # Two exemptions, both narrow and both deliberate:
          #
          #  legacy/  is a frozen archive. Nothing is ever added to it, so it
          #           cannot be a source of new bloat. It holds two oversized
          #           files that are the audit's primary evidence: the leaked
          #           TESS notebook (2.5 MB of saved outputs proving the 100 %
          #           claim) and the 3.0 MB vision report PDF.
          #
          #  the text aggregate  is 3.1 MB and tracked so that
          #           `make eval-baseline` reproduces the audit's 71.55 % on a
          #           fresh clone with no credentials and no downloads.
          #
          # Exempting by exact path rather than raising LIMIT keeps both visible
          # and forces a third entry to be argued for. Mirrors the allowlist in
          # .pre-commit-config.yaml.
          BIG=$(git ls-tree -r -l HEAD | awk -F'\t' -v lim="$LIMIT" '
            { split($1, f, /[ \t]+/); size = f[4]; path = $2 }
            size > lim \
              && path !~ /^legacy\// \
              && path != "data/raw/text_emotion_aggregate.csv" {
                printf "  %.1f MB  %s\n", size / 1048576, path
              }')
          if [ -n "$BIG" ]; then
            echo "::error::files over 2 MB are tracked; datasets and weights belong on the HF Hub"
            echo "$BIG"
            exit 1
          fi
          echo "no oversized tracked files outside the allowlist"

      - name: Reject model weights and datasets in git
        run: |
          BAD=$(git ls-files | grep -Ei '\.(h5|keras|pkl|pt|pth|ckpt|onnx|safetensors|tflite)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::model weights must not be tracked; publish to the HF Hub instead"
            echo "$BAD"
            exit 1
          fi
          echo "no tracked model weights"

      - name: Reject notebook outputs outside legacy/
        run: |
          BAD=$(git ls-files 'notebooks/*.ipynb' | xargs -r grep -l '"output_type"' || true)
          if [ -n "$BAD" ]; then
            echo "::error::notebook outputs committed; nbstripout should have run"
            echo "$BAD"
            exit 1
          fi
          echo "notebooks are clean"

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pre-commit run --all-files --show-diff-on-failure
