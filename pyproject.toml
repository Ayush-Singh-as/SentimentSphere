[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentimentsphere"
version = "2.0.0.dev0"
description = "Multimodal emotion recognition over text, speech, and facial expression, with calibrated late fusion."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ayush Singh" }]
requires-python = ">=3.11,<3.13"
keywords = ["emotion-recognition", "multimodal", "speech", "nlp", "computer-vision", "late-fusion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core: enough to run the label space, config, splits, metrics, and the CLI.
# Heavy per-modality deps live in extras so CI and the Space stay lean.
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "joblib>=1.4",
  "huggingface-hub>=0.23",
  "tqdm>=4.66",
]

[project.optional-dependencies]
text = [
  "torch>=2.3",
  "transformers>=4.44",
  "sentencepiece>=0.2",
  "tokenizers>=0.19",
  "neattext>=0.1.3",          # v1 parity: reproduces the training-time cleaning
]
audio = [
  "torch>=2.3",
  "torchaudio>=2.3",
  "transformers>=4.44",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "audiomentations>=0.36",
]
vision = [
  "torch>=2.3",
  "torchvision>=0.18",
  "timm>=1.0",
  "opencv-python-headless>=4.10",   # headless: no GUI libs, required for containers
  "pillow>=10.3",
  "mediapipe>=0.10.14",             # face detection + 5-point alignment (replaces Haar)
  "albumentations>=1.4",
]
fusion = [
  "lightgbm>=4.4",
]
serving = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "onnxruntime>=1.18",
  "prometheus-client>=0.20",
]
demo = [
  "gradio>=4.44",
]
track = [
  "wandb>=0.17",
]
# Phase 1 only: loading the v1 Keras artifacts (keras_version 2.0.6 / 2.4.0)
# to score the honest baseline. tf-keras provides the Keras 2 compat layer that
# TF>=2.16 needs to read these legacy files at all.
legacy = [
  "tensorflow-cpu>=2.16,<2.21",
  "tf-keras>=2.16",
  "h5py>=3.11",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "nbstripout>=0.7",
  "types-PyYAML",
  "pandas-stubs",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]
all = [
  "sentimentsphere[text,audio,vision,fusion,serving,demo,track]",
]

[project.scripts]
sphere = "sentimentsphere.cli:app"

[project.urls]
Homepage = "https://github.com/Ayush-Singh-as/SentimentSphere"
Repository = "https://github.com/Ayush-Singh-as/SentimentSphere"

[tool.hatch.build.targets.wheel]
packages = ["src/sentimentsphere"]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy", "notebooks"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "TID",       # tidy imports
  "PTH",       # use pathlib
  "NPY",       # numpy legacy random
  "RUF",
]
ignore = [
  "E501",    # line length is ruff-format's job
  "B008",    # typer uses function calls in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# --------------------------------------------------------------------------- #
# mypy — strict on src/, lenient on tests, legacy excluded entirely
# --------------------------------------------------------------------------- #
[tool.mypy]
# 3.12, not 3.11: numpy>=2 ships stubs that use PEP 695 `type` statements, which
# mypy refuses to parse when told to target 3.11. Runtime support stays >=3.11
# (the CI test matrix covers both); only the type-check target is pinned up.
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["^legacy/", "^notebooks/", "^build/"]

[[tool.mypy.overrides]]
# Optional extras: absent from the core dev environment by design, so mypy must
# not treat their absence as an error.
module = [
  "librosa.*", "soundfile.*", "cv2.*", "mediapipe.*", "timm.*",
  "sklearn.*", "lightgbm.*", "gradio.*", "wandb.*", "transformers.*",
  "audiomentations.*", "albumentations.*", "tensorflow.*", "tf_keras.*",
  "torch.*", "torchaudio.*", "torchvision.*", "neattext.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: takes more than ~5s (deselect with '-m \"not slow\"')",
  "gpu: requires a CUDA device",
  "needs_data: requires a downloaded dataset (deselect in CI)",
  "needs_artifacts: requires model weights in artifacts/",
]

[tool.coverage.run]
source = ["src/sentimentsphere"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
